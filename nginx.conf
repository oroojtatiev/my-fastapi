# HTTP: всё на канонический https://www.orooj.dev
server {
    listen 80;
    listen [::]:80;

    server_name orooj.dev www.orooj.dev;

    return 301 https://www.orooj.dev$request_uri;
}

# HTTPS: канонический хост — www.orooj.dev
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;

    server_name orooj.dev www.orooj.dev;

    ssl_certificate /etc/letsencrypt/live/orooj.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/orooj.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://*.amazonaws.com data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    if ($host = orooj.dev) {
        return 301 https://www.orooj.dev$request_uri;
    }

    location /static/ {
        alias /var/www/fastapi-course/static/;
        expires 7d;
    }

    # FastAPI (uvicorn, published by docker compose on 127.0.0.1:8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
